{# Category #}
<label>Category
  <select name="category" id="field-category" required onchange="handleSelectOther(this, 'category-other-wrap')">
    {% for c in cfg.CATEGORIES %}<option>{{ c }}</option>{% endfor %}
  </select>
  <div id="category-other-wrap" style="display: none; margin-top: 0.5rem;">
    <input name="category_other" id="field-category-other" placeholder="Specify item category (e.g. Earphones, Jacket, Helmet)">
  </div>
</label>

{# Color #}
<label>Color
  <select name="color" id="field-color" onchange="handleSelectOther(this, 'color-other-wrap')">
    {% for c in cfg.COLORS %}<option>{{ c }}</option>{% endfor %}
  </select>
  <div id="color-other-wrap" style="display: none; margin-top: 0.5rem;">
    <input name="color_other" id="field-color-other" placeholder="Specify color (e.g. Teal, Maroon, Camouflage)">
  </div>
</label>

{# Brand #}
<label>Brand (optional)
  <input name="brand" placeholder="e.g. Casio">
</label>

{# Description #}
<label>Description
  <textarea name="description" id="field-desc" rows="3" required maxlength="500" placeholder="e.g. black scientific calculator with a sticker"></textarea>
  <small style="color: var(--muted); font-size: 0.8125rem; font-weight: normal; margin-top: -0.2rem;"><span id="desc-count">0</span> / 500 characters</small>
</label>

{# Room / Location #}
<label>Room / location
  <select name="location" id="field-location" required onchange="handleSelectOther(this, 'location-other-wrap')">
    {% for l in cfg.LOCATIONS %}<option>{{ l }}</option>{% endfor %}
  </select>
  <div id="location-other-wrap" style="display: none; margin-top: 0.5rem;">
    <input name="location_other" id="field-location-other" placeholder="Specify room or area (e.g. Canteen, Library, Gym, Gate 1)">
  </div>
</label>

{# Date & Time #}
<label>Date and time
  <input type="datetime-local" name="event_time" id="field-event-time" value="{{ now }}" required>
</label>

<script>
function handleSelectOther(selectEl, wrapId) {
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;
  if (selectEl.value === 'Other') {
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
    var inp = wrap.querySelector('input');
    if (inp) inp.value = '';
  }
}

(function() {
  // Live counter for description
  var desc = document.getElementById('field-desc');
  var cnt = document.getElementById('desc-count');
  if (desc && cnt) {
    desc.addEventListener('input', function() {
      cnt.textContent = desc.value.length;
    });
    cnt.textContent = desc.value.length;
  }

  // Set min to 5 years ago, max to current moment
  var dt = document.getElementById('field-event-time');
  if (dt) {
    var now = new Date();
    var pad = function(n) { return String(n).padStart(2, '0'); };
    var maxStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    var minDate = new Date(now);
    minDate.setFullYear(minDate.getFullYear() - 5);
    var minStr = minDate.getFullYear() + '-' + pad(minDate.getMonth()+1) + '-' + pad(minDate.getDate()) + 'T00:00';
    dt.max = maxStr;
    dt.min = minStr;
  }

  // Init "Other" state on load in case browser pre-selects "Other"
  ['field-category', 'field-color', 'field-location'].forEach(function(id) {
    var sel = document.getElementById(id);
    if (sel && sel.value === 'Other') {
      var wrapId = id.replace('field-', '') + '-other-wrap';
      var wrap = document.getElementById(wrapId);
      if (wrap) wrap.style.display = 'block';
    }
  });
})();
</script>
