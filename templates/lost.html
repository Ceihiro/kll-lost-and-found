{% extends "base.html" %}
{% block title %}Report a lost item{% endblock %}
{% block content %}
<h1>Report a lost item</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% include "_fields.html" %}
  <label>Your Name
    <input name="reporter_name" placeholder="e.g. Juan dela Cruz" required>
  </label>
  <label>Student ID
    <input name="reporter_id" placeholder="e.g. 2024-00123" required>
  </label>
  <label>Year &amp; Section
    <input name="reporter_section" placeholder="e.g. 3-BSIT-A" required>
  </label>
  <button type="submit">Find possible matches</button>
</form>
{% endblock %}
